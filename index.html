 — ≥ 6 settimane",items:[$("fluclox","Beta-lattamico antistafilococcico",null),$("genta","+ Gentamicina (prime 2 settimane)",null),$("rifa","+ Rifampicina (dopo negativizzazione delle colture)",null)],all:!0},{title:"Allergia ai beta-lattamici (§ 8)",items:[$("vanco","Vancomicina EV (TDM)",null),$("dapto","Daptomicina","8–10 mg/kg q24h")],note:"Cefazolina solo dopo rivalutazione allergologica in reazioni non-tipo I. Valutare la desensibilizzazione negli allergici severi: il beta-lattamico resta superiore."}]},{group:"Terapia mirata (§ 3, ESC 2023)",id:"mrsa",name:"MRSA e CoNS",blocks:[{title:"MRSA NVE — 4–6 settimane",items:[$("vanco","Vancomicina EV","TDM, AUC/MIC 400–600"),$("dapto","Daptomicina","8–10 mg/kg EV q24h","Dose alta, eventualmente associata a cefalosporina anti-stafilococcica")]},{title:"MRSA PVE / CoNS PVE — ≥ 6 settimane",items:[$("vanco","Vancomicina",null),$("rifa","+ Rifampicina",null),$("genta","+ Gentamicina (prime 2 settimane)",null)],all:!0},{title:"Allergia",text:"Nessun impatto (vancomicina, daptomicina)."}]},{group:"Terapia mirata (§ 3, ESC 2023)",id:"hacek",name:"HACEK",blocks:[{title:"4 settimane",items:[$("ceftriaxone","Ceftriaxone","2 g q24h")]}]},{group:"Terapia mirata (§ 3, ESC 2023)",id:"cox",name:"Coxiella burnetii",blocks:[{title:"≥ 18 mesi (con infettivologo)",text:"Doxiciclina + idrossiclorochina (dosi non specificate nel protocollo)."}]},{group:"Terapia mirata (§ 3, ESC 2023)",id:"fungi",name:"Funghi (Candida/Aspergillus)",blocks:[{title:"Indicazione",tone:"red",text:"Terapia antifungina EV + chirurgia quasi sempre; infettivologo obbligatorio."}]},{group:"Terapia mirata (§ 3, ESC 2023)",id:"neg",name:"Emocolture negative",blocks:[{title:"Indicazione",text:"Batteri fastidious (HACEK, Coxiella, Bartonella, funghi) — sierologie e PCR; rivalutare con microbiologo prima di allungare terapie empiriche."}]},{group:"Infezioni da CIED (§ 7)",id:"cied",name:"Infezione del CIED",sub:"Regola cardine, diagnosi, empirica",blocks:[{title:"Regola cardine",tone:"red",text:"Infezione del CIED = rimozione completa del sistema (generatore + tutti i lead, inclusi lead abbandonati), in centro con esperienza di estrazione, idealmente entro 3 giorni dalla diagnosi, senza attendere la sterilizzazione delle colture (EHRA consensus, AHA 2024). Trattare solo con antibiotici lasciando il device in sede porta a recidive quasi costanti."},{title:"Eccezione",text:"Infezione superficiale della ferita (ascesso dei punti) senza coinvolgimento della tasca o del device → terapia locale/conservativa con follow-up stretto."},{title:"Diagnosi",list:["Emocolture prima dell'antibiotico (almeno 2 set).","TEE in ogni batteriemia con CIED in sede (valutare lead e valvole); TTE prima.","PET/CT con 18F-FDG: utile per tasca e lead quando l'eco è dubbia (ESC 2023).","Colture della tasca e dei lead alla rimozione; non fare tamponi superficiali di routine (scarsa specificità).","Batteriemia da S. aureus con CIED in sede senza altri focolai = considerare estrazione."]},{title:"Empirica (dopo colture) — passare a mirata entro 48 ore",items:[$("vanco","Vancomicina EV",null),$("cefotaxime","+ Cefotaxime","2 g EV q8h"),$("cefepime","(o cefepime)",null)],all:!0}]},{group:"Infezioni da CIED (§ 7)",id:"ciedDur",name:"Durata della terapia CIED",sub:"Dal giorno dell'estrazione o dalla prima emocoltura negativa, se successiva",blocks:[{title:"Durata (AHA 2024, EHRA)",list:["Infezione di tasca isolata (purulenta): 10–14 giorni (possibile completamento orale)","Erosione cutanea senza pus: 7–10 giorni","Batteriemia senza vegetazioni (TEE negativo), non-S. aureus: 2 settimane","Batteriemia senza vegetazioni, S. aureus: 4 settimane","Vegetazione isolata sui lead: 2 settimane (4 settimane se S. aureus)","Coinvolgimento valvolare: come l'endocardite valvolare, 4–6 settimane (6 in protesi)"]},{title:"Nuovo impianto (se ancora indicato)",text:"Colture negative da ≥ 72 ore dopo l'estrazione; attendere ≥ 2 settimane se c'erano vegetazioni; sito controlaterale."},{title:"Estrazione impossibile (rischio estremo, rifiuto)",text:"Terapia EV iniziale seguita da soppressione antibiotica a lungo termine con infettivologo."},{title:"Prevenzione",list:["Profilassi peri-procedura all'impianto (cefazolina, secondo protocollo chirurgico aziendale).","Tecnica sterile rigorosa, tasca adeguata, minimizzare lead abbandonati.","Nessuna profilassi antibiotica cronica nei portatori di CIED.","Istruzione del paziente alla dimissione: segnalare subito febbre o modificazioni della tasca."]}]}],jg=["Nell'endocardite la durata conta dal giorno di negativizzazione delle colture: anche in AKI, non abbreviare gli schemi basandosi solo sull'eGFR — aggiustare le dosi, non la durata.","Gentamicina: TDM obbligatorio (trough < 1 mg/L), monitorare creatinina e ototossicità ogni 48–72 ore; preferire lo schema ampicillina + ceftriaxone in insufficienza renale per evitare l'aminoglicoside.","Vancomicina e daptomicina in endocardite: dosi alte (AUC-guidati / 8–10 mg/kg) e TDM sistematico.","Ricalcolare l'eGFR ogni 2–3 giorni nelle prime 2 settimane: l'AKI da terapia è frequente e va distinto dalla progressione dell'infezione."],zg=["Endocarditis Team: ogni caso discussione condivisa cardiologo + infettivologo + chirurgo + microbiologo.","3 set di emocolture prima dell'antibiotico; terapia empirica solo nei quadri acuti/severi.","Terapia mirata entro 24–48 ore dall'identificazione; nessuna prosecuzione di spettro ampio senza motivo.","Beta-lattamici ad alte dosi EV: cefazolina/flucloxacillina per MSSA (non vancomicina di routine).","Due fasi: ricovero EV per la fase critica, poi OPAT/orale nei selezionati — riduce la degenza senza aumentare le recidive.","Chirurgia non ritardata: emergenza < 24 h, urgenza 3–5 giorni quando indicata.","CIED infetto = estrazione completa, entro ~3 giorni: gli antibiotici da soli falliscono.","Durate contate correttamente: dal giorno di negativizzazione delle colture o dell'estrazione (CIED).","Profilassi dell'endocardite: solo ic J Medicine / MDedge",url:"https://www.mdedge.com/ccjm/article/95532/cardiology/cardiovascular-implantable-electronic-device-infection-stepwise/page/0/3",tags:[]},{tag:"AEPEI/SPILF",title:"Consensus francese su terapia antibiotica e profilassi dell'endocardite (basato su ESC 2023) — PDF",url:"https://hal.science/hal-04834189/file/1-s2.0-S2666991924001787-main.pdf",tags:[]}],Ti={ceftriaxone:{name:"Ceftriaxone",g60:"2 g q12h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento"},cefotaxime:{name:"Cefotaxime",g60:"2 g q8h",g30:"Nessun aggiustamento",g10:"2 g q12h",d:"1–2 g q12h post-dialisi"},cefepime:{name:"Cefepime",g60:"2 g q8h",g30:"2 g q12h",g10:"1–2 g q12h",d:"1 g q24h"},ampicillina:{name:"Ampicillina",g60:"2 g q4h",g30:"2 g q6h",g10:"2 g q8h",d:"1–2 g q8h post-dialisi"},meropenem:{name:"Meropenem",g60:"2 g q8h",g30:"2 g q8h",g10:"1 g q12h",d:"0,5–1 g q24h post-dialisi"},vanco:{name:"Vancomicina EV",g60:"25–30 mg/kg carico, poi 15–20 mg/kg q8–12h",g30:"TDM, target trough 15–20 mg/L (SNC)",g10:"Estendere secondo livelli",d:"Estendere q48–96h secondo livelli",tdm:!0},genta:{name:"Gentamicina",g60:"2 mg/kg q8h (o schemi once-daily)",g30:"TDM sempre",g10:"Solo TDM",d:"Solo TDM post-dialisi",tdm:!0},metro:{name:"Metronidazolo",g60:"500 mg q8h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Metà dose post-dialisi"},aciclovir:{name:"Aciclovir",g60:"10 mg/kg q8h",g30:"10 mg/kg q12h",g10:"10 mg/kg q24h",d:"5 mg/kg q24h post-dialisi — idratazione abbondante (nefrotossicità da cristalli)"},tmpsmx:{name:"TMP-SMX",g60:"5 mg/kg (TMP) q8h (dosaggi alti per Nocardia/Listeria)",g30:"Metà dose",g10:"Metà dose q12h",d:"Evitare o metà dose q24h post-dialisi"},rifa:{name:"Rifampicina",g60:"600 mg q24h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento"},linezolid:{name:"Linezolid",g60:"600 mg q12h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento (TDM utile)"},cipro_ev:{name:"Ciprofloxacina EV",g60:"400 mg q8h",g30:"400 mg q8–12h",g10:"400 mg q12h",d:"400 mg q24h"},vorico:{name:"Voriconazolo",g60:"6 mg/kg q12h ×2 dosi, poi 4 mg/kg q12h",g30:"Nessun aggiustamento (evitare la formulazione EV con ciclodestrina se eGFR < 50: preferire OS)",g10:"Nessun aggiustamento (evitare la formulazione EV con ciclodestrina: preferire OS)",d:"Nessun aggiustamento (preferire OS)"}},da=Object.keys(Ti),Ng=["ceftriaxone","cefotaxime","cefepime","ampicillina","meropenem","fluclox","cefazolina","aztreonam"],Sg=["Antibiotico + desametasone entro 1 ora dal sospetto/riconoscimento (ESCMID).","Rachicentesi prima dell'antibiotico se non ci sono controindicazioni (compromissione grave della coscienza, deficit neurologici focali, nuove crisi epilettiche, immunodepressione, segni di ipertensione endocranica): prelievo LCS immediato, poi terapia.","Se controindicazioni alla rachicentesi o quadro gravissimo: emocolture + terapia immediata, LCS dopo imaging.","Nessun ritardo per l'imaging quando il quadro clinico è tipico."],qd=["Desametasone 10 mg EV q6h per 4 giorni, iniziato prima o insieme alla prima dose di antibiotico; se l'antibiotico è già stato dato, si può ancora iniziare entro 4 ore (grade A ESCMID).","Sospendere se la meningite non è batterica o il patogeno non è S. pneumoniae o H. influenzae (in particolare: sospendere in listeriosi).","Il desametasone riduce la penetrazione liquorale della vancomicina — negli schemi con vancomicina considerare di aggiungere rifampicina o passare a meropenem (EpiCentro ISS)."],Pd='Dosi "da SNC": ceftriaxone 2 g q12h, cefepime 2 g q8h, meropenem 2 g q8h, ampicillina 2 g q4h, vancomicina 25–30 mg/kg carico poi 15–20 mg/kg q8–12h con TDM.',Dd=["LCS: cellule, formula, proteine, glucosio (con glicemia contemporanea per il rapporto), colorazione di Gram, coltura + antibiogramma; PCR multiplex batterica quando disponibile.","Antigeni urinari (pneumococco, Legionella) se coesiste sospetto di polmonite.","Emocolture prima dell'antibiotico.","Emocolture di controllo solo se patogeno resistente o risposta lenta (non di routine).","Ricerca della porta d'ingresso: otite, sinusite, polmonite, endocardite (valutare sempre!), focolaio dentale."],Td=["Febbre + alterazione dello stato mentale ± crisi epilettiche, segni neurologici focali.","Aciclovir EV entro 6 ore dal sospetto, non aspettare la diagnostica (infografica EAN/ESCMID).","RM cerebrale (preferita alla TC) + LCS (PCR HSV-1/2, VZV, enterovirus, panel multiplex se disponibile — ma non escludere l'HSV sulla sola base del panel multiplex: richiedere PCR HSV dedicata se il sospetto persiste).","Ricercare cause non infettive: encefalite autoimmune (anti-NMDAR e pannello autoanticorpale su LCS), metaboliche, tossiche.","Screening infettivo mirato sull'epidemiologia: zecche (TBE, rickettsie), viaggi, immunodepressione (CMV, EBV, HHV-6, Toxoplasma, JC virus), HIV, influenza stagionale."],_d=["Diagnosi alternativa confermata o basso sospetto clinico di HSE","PCR HSV su LCS negativa (se il prelievo è stato fatto > 72 ore dall'esordio neurologico)","Cellule bianche nel LCS normali","RM senza anomalie del lobo temporale"],Vd=["RM cerebrale con gadolinio + sequenze di diffusione (DWI/ADC): imaging di prima scelta (TC solo se RM non disponibile) (ESCMID 2024).","Cercare la fonte: sinusite, otite, focolaio dentale, endocardite, polmonite/empiema, infezione cutanea, trauma; valutare sempre ecocardiogramma ed esame odontoiatrico.","Aspirazione o escissione chirurgica raccomandata sempre che tecnicamente fattibile (diagnostica + terapeutica; mortalità inferiore al trattamento conservativo).","Nei pazienti non gravi, se la neurochirurgia è possibile entro ~24 ore, gli antibiotici possono essere differiti fino all'aspirato (per non sterilizzare i campioni).","Diagnostica molecolare (PCR 16S/18S, mNGS) se le colture sono negative."],Od=["Aspirato o trattamento conservativo: 6–8 settimane di terapia EV (raccomandazione condizionale).","Escissione completa: possibile 4 settimane."
