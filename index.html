ipicamente 7 giorni con source control adeguato e risposta clinica; de-escalation appena disponibili antibiogramma e risposta clinica.",s)}const vc=[{id:"sab",name:"Staphylococcus aureus (SAB)",sub:"Consulenza infettivologica sempre",blocks:[{title:"Work-up minimo obbligatorio (IDSA/ESCMID 2026)",list:["SAB: principale causa di morte per infezione del torrente ematico — gestione sempre con consulenza infettivologica (IDSA/ESCMID 2026, executive summary).","Emocolture di controllo (FUBC): almeno 2 set a 48 ore dalla prima positiva, poi 1–2 set ogni 24–48 ore fino a negativizzazione.","Ecocardiogramma transtoracico (TTE) in tutti gli adulti; TEE se TTE negativo con fattori di rischio di endocardite (dispositivo intracardiaco, valvulopatia, coltura positiva ≥ 48 h, fenomeni embolici, focolai multipli non contigui).","Rimozione di cateteri/dispositivi e source control di ogni focolaio drenabile.","Coltura positiva a ≥ 48 ore dalla prima = segnale di focolaio profondo (endocardite, osteomielite, tromboflebite settica, ascesso metastatico): intensificare la diagnostica."]},{title:"Stratificazione di rischio",list:["Low-risk: comunitaria, focolaio rimosso, colture negative a 48 h, no dispositivi intracardiovascolari, no immunodepressione.","Increased-risk: focolaio non controllabile, batteriemia persistente ≥ 48 h, dispositivo intracardiaco/protesico, valvulopatia, immunodepressione, emodialisi."]},{title:"MSSA",items:[T("cefazolina","Cefazolina","2 g EV q8h","Prima scelta"),T("fluclox","Flucloxacillina/oxacillina","2 g EV q6h")]},{title:"MRSA",items:[T("vanco","Vancomicina EV","TDM, AUC/MIC 400–600"),T("dapto","Daptomicina","8–10 mg/kg EV q24h")]},{title:"MSSA in allergia tipo I (§ 8)",items:[T("vanco","Vancomicina EV (TDM)",null),T("dapto","Daptomicina","8–10 mg/kg q24h")],note:"Cefazolina possibile solo dopo valutazione allergologica in reazioni non-tipo I."},{title:"Durata",list:["Batteriemia senza focolai profondi: 14 giorni (low-risk E increased-risk, se work-up completo negativo e risposta clinica) — dal giorno di negativizzazione delle emocolture o dal source control se successivo.","Prolungare oltre 14 giorni solo se batteriemia persistente, work-up incompleto o focolaio che lo richiede (Consensus Statement 7).","Focolaio profondo documentato: durata dettata dal focolaio (osteomielite 4–6 settimane, ecc.).","Endocardite (ESC 2023): 4–6 settimane (NVE); ≥ 6 settimane per protesi valvolare; con infettivologo e cardiologo."]}]},{id:"efs",name:"Enterococcus faecalis",sub:"",blocks:[{title:"Terapia",items:[T("ampicillina","Ampicillina","2 g EV q4–6h"),T("ceftriaxone","Ceftriaxone","2 g q24h","In alternativa, utile in insufficienza renale")]},{title:"Sospetta endocardite",tone:"red",text:"Il ceftriaxone in monoterapia è un'alternativa solo nella batteriemia senza endocardite. Se si sospetta un'endocardite, trattare in combinazione ampicillina + ceftriaxone (vedi modulo Endocarditi, § 3.2)."},{title:"Allergia tipo I (§ 8)",items:[T("linezolid","Linezolid",null),T("dapto","Daptomicina",null),T("vanco","Vancomicina (se sensibile)",null)]},{title:"Durata",list:["Paziente non immunodepresso, focolaio controllato, non endocardite: 7 giorni con consulenza infettivologica.","Endocardite: 4–6 settimane."]},{title:"Attenzione",tone:"red",text:"Non trattare le colture positive da singolo set in paziente stabile senza focolaio (probabile contaminazione): ripetere."}]},{id:"efm",name:"Enterococcus faecium",sub:"Spesso resistente all'ampicillina",blocks:[{title:"Terapia (secondo antibiogramma)",items:[T("vanco","Vancomicina EV",null),T("linezolid","Linezolid",null),T("dapto","Daptomicina",null)]},{title:"Durata",list:["Paziente non immunodepresso, focolaio controllato, non endocardite: 7 giorni con consulenza infettivologica.","Endocardite: 4–6 settimane."]}]},{id:"gn",name:"Gram-negativi",sub:"E. coli, Klebsiella, Pseudomonas…",blocks:[{title:"Terapia mirata",text:"Secondo antibiogramma: preferire sempre lo spettro più stretto attivo (cefalosporina di III gen. o FQ sensibili prima di carbapenem)."},{title:"ESBL",items:[T("ertapenem","Ertapenem",null),T("meropenem","Meropenem",null)],note:"Secondo sensibilità."},{title:"KPC (con infettivologo)",items:[T("cza","Ceftazidime/avibactam",null),T("merovabor","Meropenem/vaborbactam",null)]},{title:"Allergia tipo I (§ 8)",items:[T("aztreonam","Aztreonam","2 g EV q8h")],note:"O FQ/aminoglicoside secondo sensibilità."},{title:"Durata",list:["7 giorni dalla negativizzazione delle emocolture in paziente con risposta clinica e source control.","Batteriemia da catetere: rimozione del catetere + 7 giorni."]}]},{id:"cand",name:"Candida (candidemia)",sub:"",blocks:[{title:"Prima linea: echinocandina",items:[T("caspo","Caspofungina","70 mg carico poi 50 mg q24h"),T("anidula","Anidulafungina","200 mg carico, poi 100 mg q24h"),T("mica","Micafungina",null)]},{title:"De-escalation",items:[T("fluco","Fluconazolo","400 mg/die (dose 6 mg/kg)","Se ceppo sensibile e paziente stabile dopo 5–7 giorni")]},{title:"Durata e gestione",list:["14 giorni dalla prima emocoltura negativa e dalla risoluzione dei sintomi.","Ecocardiogramma e fondo oculare in tutti; rimuovere catetere centrale; valutare source control (eventuale chirurgia)."]}]},{id:"crbsi",name:"Batteriemia da catetere (CRBSI)",sub:"Punti essenziali",blocks:[{title:"Gestione",list:["Rimozione del catetere in sepsi, shock, batteriemia persistente, funghi, S. aureus, Pseudomonas, tunnel.","Colture qualitative di punta del catetere + emocolture periferiche.","Antibiotico lock solo in cateteri salvabili e microbiologia nota.","Durata: 7–14 giorni (secondo patogeno e rimozione del catetere) — S. aureus secondo § 6.1."]}]},{id:"cont",name:"Contaminanti",sub:"CNS, Micrococcus, Bacillus, Propionibacterium",blocks:[{title:"Non trattare",tone:"red",text:"Un singolo set positivo a CNS, Micrococcus, Bacillus, Propionibacterium in paziente stabile è di norma contaminazione: ripetere le emocolture se sospetto clinico, non antibiotico."}]}],hf=["In sepsi la funzione renale cambia rapidamente (AKI precoce frequentissimo): ricalcolare l'eGFR ogni 24–48 ore nelle prime 72 ore e a ogni variazione della diuresi.","Vancomicina, aminoglicosidi, colistina: TDM non negoziabile in terapia protratta.","Beta-lattamici in paziente critico: considerare l'infusione estesa e il TDM (concentrazioni sub-terapeutiche frequenti in sepsi per volume di distribuzione e clearance aumentati).","I dosaggi sono indicativi: fare riferimento alla scheda tecnica e al farmacista aziendale per i protocolli di TDM locali."],vf=['Antibiotico entro 1 ora in shock settico e sepsi probabile/certa; valutazione rapida (entro 3 ore) nella sepsi possibile senza shock — non trattare tutto ciò che "forse" è sepsi.',"Emocolture prima dell'antibiotico, sempre almeno 2 set.","Terapia mirata al focolaio, non massimale di routine: anti-anaerobi e antifungini empirici solo a rischio.","Infusione estesa dei beta-lattamici nei critici.","Source control entro 6 ore: nessun antibiotico sostituisce un drenaggio o la rimozione di un catetere.","De-escalation a 48–72 ore sull'antibiogramma, sempre.","SAB = consulenza infettivologica sempre: FUBC a 48 ore, TTE in tutti, 14 giorni se low/increased-risk senza focolai profondi, conteggio dal giorno di negativizzazione.","Durate brevi: 7 giorni per le batteriemie da GN e CRBSI, 14 giorni candidemia e SAB semplice.","Non trattare i contaminanti: CNS/Bacillus/Micrococcus da singolo set in paziente stabile = ripetere, non antibiotico.","Aggiornare annualmente il documento su antibiogramma locale e resistenze emergenti (KPC, ESBL, MRSA)."],hu=[{tag:"SSC 2026",title:"Surviving Sepsis Campaign 2026 — International Guidelines for Management of Sepsis and Septic Shock",links:[{label:"SCCM",url:"https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026"},{label:"Intensive Care Medicine 2026",url:"https://link.springer.com d:"1–2 g q12h post-dialisi"},fluclox:{name:"Oxacillina EV",g60:"2 g q4h (12 g/die)",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Considerare riduzione dose del 50 %"},fluclox_os:{name:"Flucloxacillina OS (step-down)",g60:"500–1000 mg q6h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Considerare riduzione dose del 50 %"},cefazolina:{name:"Cefazolina",g60:"2 g q8h (6 g/die)",g30:"1–2 g q8h",g10:"1–2 g q12h",d:"1 g q24h"},ceftriaxone:{name:"Ceftriaxone",g60:"2 g q24h (4 g/die in 2 dosi nell'empirica e in E. faecalis)",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento"},cefepime:{name:"Cefepime",g60:"2 g q8h",g30:"2 g q12h",g10:"1–2 g q12h",d:"1 g q24h"},vanco:{name:"Vancomicina EV",g60:"Carico 25–30 mg/kg, poi 30 mg/kg/die in 2 dosi (TDM, AUC 400–600)",g30:"TDM (AUC 400–600)",g10:"Estendere secondo livelli",d:"Estendere q48–96h secondo livelli",tdm:!0},dapto:{name:"Daptomicina‡",g60:"10 mg/kg q24h (8–12; enterococchi 10–12)",g30:"Nessun aggiustamento",g10:"Stessa dose q48h",d:"Stessa dose q48h post-dialisi"},genta:{name:"Gentamicina",g60:"3 mg/kg q24h (solo se indicata, TDM)",g30:"TDM sempre, estendere l'intervallo",g10:"Solo TDM",d:"Solo TDM, post-dialisi",tdm:!0},rifa:{name:"Rifampicina",g60:"900 mg/die in 2–3 dosi (solo se protesi, dopo negativizzazione)",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento (epatica)"},linezolid:{name:"Linezolid‡",g60:"600 mg q12h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento (TDM utile)"},metro:{name:"Metronidazolo",g60:"500 mg q8h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Metà dose post-dialisi"}},Gi=Object.keys(oi),bf=["amox","amc_ev","fluclox","fluclox_os","cefazolina","ceftriaxone","cefepime","ceftazidime","meropenem","ertapenem","piptazo"],zf=[["NVE","Endocardite su valvola nativa"],["PVE precoce","Endocardite su protesi valvolare entro 12 mesi dall'impianto: eziologia spesso nosocomiale (S. aureus, CoNS, Gram-negativi, funghi)"],["PVE tardiva","Oltre 12 mesi dall'impianto: eziologia sovrapponibile alla NVE"],["EI su CIED","Infezione degli elettrocateteri o del sistema, con o senza coinvolgimento valvolare"],["Infezione di tasca (pocket)","Infezione localizzata alla loggia del generatore di PMK/ICD"],["Endocardite destra","Tricuspide/polmonare (spesso persone che usano droghe e.v. o portatori di device)"],["Epidemiologia locale (2025)","Batteriemie aziendali: MRSA 15,3 % degli S. aureus; E. faecium resistente alla vancomicina 28,8 %; K. pneumoniae ESBL 67,3 % e resistente ai carbapenemi 49,7 %; E. coli ESBL 41,4 %. Dato su Candida da completare."]],vu="Ogni batteriemia da S. aureus, E. faecalis o streptococchi in paziente con protesi valvolare (anche TAVI), cardiopatia strutturale o CIED = endocardite fino a prova contraria.",bu="La durata si conta dal primo giorno di terapia efficace con emocolture negative, non dalla data di inizio dell'antibiotico né da quella della chirurgia.",zu=["Emocolture: 3 set (aerobi + anaerobi, 10 mL per flacone) da venipunture separate prima dell'antibiotico, senza attendere la febbre; ripetere ogni 24–48 h fino a negativizzazione.","FilmArray (PCR multiplex, pannello emocolture) sul flacone positivo: identificazione rapida e geni di resistenza (mecA, vanA/B, carbapenemasi). Non utilizzabile su sangue né con emocolture negative.","Criteri Duke-ISCVID 2023 (adottati da AHA 2026): patogeni tipici ampliati (incluso E. faecalis), TC cardiaca e PET/TC come criteri maggiori, criterio chirurgico; diagnosi esclusa se risoluzione con terapia ≤ 4 giorni.","Ecocardiografia: ETT di primo livello; ETE diretto se protesi (anche TAVI), CIED o batteriemia da S. aureus; ETE se ETT negativo o non diagnostico con sospetto persistente; ripetere a 5–7 giorni se sospetto alto; ETE entro 2 giorni prima del passaggio orale.","PET/TC con 18F-FDG: sospetta PVE con ecocardiogramma negativo o dubbio (criterio maggiore oltre 3 mesi dall'impianto), localizzazioni extracardiache, CIED; non di routine nella NVE. Tempistica concordata con il radiologo. SPECT/TC con leucociti marcati non disponibile in azienda.","TC cardiaca per complicanze paravalvolari; RMN encefalo se sintomi neurologici e prima della chirurgia; TC torace-addome nei sintomatici.","Emocolture negative: sierologie (C. burnetii, Bartonella, Brucella, Legionella, Mycoplasma), galattomannano e β-D-glucano. PCR 16S/18S non disponibile in azienda.","Tessuto valvolare o embolo: coltura (contenitore sterile senza fissativo) + istologia (formalina)."],jf=[{id:"bc",label:"3 set di emocolture prelevati prima dell'antibiotico"},{id:"eco",label:"Ecocardiogramma richiesto (ETE diretto se protesi, CIED, S. aureus)"},{id:"cch",label:"Consulto cardiochirurgico esterno valutato se possibile indicazione chirurgica"}],Sf=["Fase 1 — critica (ricovero): terapia EV battericida; chirurgia, rimozione dei corpi estranei infetti e drenaggio degli ascessi se indicati.","Fase 2 — consolidamento: nei pazienti stabili selezionati, completamento con terapia orale (POET) o OPAT. ESC 2023 classe IIa (livello A); per AHA 2026 è un'opzione, non una scelta di secondo livello.","Regimi orali (di norma due farmaci attivi, scelti dall'infettivologo): streptococchi ed E. faecalis — amoxicillina 1 g × 4/die + rifampicina 600 mg × 2/die o moxifloxacina 400 mg/die; linezolid‡ + moxifloxacina o rifampicina. HACEK — levofloxacina 750 mg/die.","MSSA/CoNS — flucloxacillina OS 500–1000 mg q6h + rifampicina 600 mg × 2/die (dose scelta sul riferimento della dicloxacillina del POET, 1 g q6h, valutata caso per caso; solo come step-down dopo fase EV con oxacillina o cefazolina); in alternativa linezolid‡ + rifampicina. Dicloxacillina e acido fusidico non disponibili in azienda."],Nf=["EI sinistra da streptococchi, E. faecalis, MSSA o CoNS","Almeno 10 giorni di terapia EV adeguata e ≥ 7 giorni dopo l'eventuale chirurgia","Stabilità: apiressia da ≥ 3 giorni, PCR < 25 % del picco o < 20 mg/L, leucociti < 15.000/mm³","ETE entro 2 giorni dal passaggio: nessuna progressione, ascesso o nuova indicazione chirurgica","Esclusioni: BMI > 40, malassorbimento, altra infezione che richiede terapia EV, scarsa aderenza, interazioni o allergie"],Cf="Cautela nella PVE e nelle persone che usano droghe e.v. (poco rappresentate nel POET). OPAT: programma aziendale in fase di definizione; dalbavancina† (1500 mg g1 e g8, o g1 e g15) o oritavancina† (1200 mg g1 e g8) off-label nell'ambito dell'OPAT, con valutazione caso per caso dell'infettivologo per fattibilità e organizzazione.",yf=[["Emergenza (< 24 h)","NVE o PVE aortica/mitralica con insufficienza acuta severa, ostruzione o fistola con edema polmonare refrattario o shock cardiogeno"],["Urgente (3–5 giorni; AHA 2026: 48–72 h)","Scompenso da disfunzione valvolare; infezione localmente non controllata (ascesso, pseudoaneurisma, fistola, vegetazione in crescita, deiscenza protesica, nuovo BAV); emocolture positive dopo 1 settimana di terapia adeguata con focolai metastatici controllati; vegetazione ≥ 10 mm dopo ≥ 1 embolia; vegetazione ≥ 10 mm con stenosi o insufficienza severa e basso rischio operatorio"],["Urgente o non urgente","Funghi o germi MDR; PVE da S. aureus o Gram-negativi non-HACEK; PVE precoce (sbrigliamento e sostituzione); vegetazione ≥ 10 mm senza disfunzione severa né emboli, basso rischio (classe IIb, trial EASE)"],["EI destra","Insufficienza tricuspidale severa con disfunzione ventricolare destra, emboli polmonari ricorrenti con insufficienza respiratoria, vegetazioni residue > 20 mm, batteriemia persistente; preferire la riparazione"],["Complicanze neurologiche","Emboli silenti, TIA o ictus ischemico: non rinviare la chirurgia se il paziente non è in coma. Emorragia intracranica: rinvio ≥ 4 settimane salvo instabilità. Coma: chirurgia non indicata. Trombolisi non indicata."],["Organizzazione aziendale","L'azienda non dispone di cardiochirurgia: consulto cardiochirurgico esterno precoce, richiesto caso per caso presso il centro di riferimento; trasferimento, anche urgente, concordato caso per caso con il centro esterno."]],Af="Durata dopo chirurgia (scelta basata su AHA 2026): completare la durata pianificata contando i giorni pre-operatori, con almeno 14 giorni dopo l'intervento; una coltura o PCR valvolare positiva non fa ripartire il ciclo (ESC 2023 prevede invece un nuovo ciclo completo). Non allungare la terapia in attesa della chirurgia.",Ef=["Alto rischio: EI pregressa, protesi valvolari chirurgiche o transcatetere e materiale per riparazione valvolare, cardiopatie congenite cianogene non corrette o corrette con materiale protesico, dispositivi di assistenza ventricolare. Non indicata per prevenire l'EI su CIED.","Procedure odontoiatriche a rischio (manipolazione gengivale/periapicale, perforazione della mucosa): amoxicillina 2 g OS/EV 30–60 min prima. Allergia: cefazolina o ceftriaxone 1 g EV (allergia non anafilattica), azitromicina o claritromicina 500 mg OS, doxiciclina 100 mg OS. Clindamicina non più raccomandata.","Può essere considerata nei pazienti ad alto rischio per procedure invasive respiratorie, gastrointestinali, genitourinarie, cutanee o muscoloscheletriche.","Prima di cardiochirurgia o impianto di protesi/CIED: screening e decolonizzazione dei portatori nasali di S. aureus, bonifica dei focolai dentari."],kf=[["Streptococchi","Vancomicina 30 mg/kg/die in 2 dosi (TDM), 4–6 settimane"],["E. faecalis","Vancomicina + gentamicina 3 mg/kg/die; alternative daptomicina‡ 10–12 mg/kg/die o linezolid‡ 600 mg q12h"],["MSSA","Allergia non anafilattica: cefazolina 6 g/die. Tipo I: vancomicina (TDM) o daptomicina‡ 10 mg/kg/die"],["MRSA / CoNS","Nessun impatto (vancomicina, daptomicina‡)"],["Empirica NVE / PVE tardiva","Cefazolina 6 g/die in 3 dosi (allergia non anafilattica) oppure vancomicina 30 mg/kg/die in 2 dosi"]],ju="Valutare la desensibilizzazione con allergologo nelle endocarditi da MSSA in allergici severi: il beta-lattamico resta superiore.",G=(e,i,a,n)=>({key:e,name:i, pneumoniae ESBL 67 %, resistente ai carbapenemi 50 % — scelta con l'infettivologo, considerando le colonizzazioni note."})):(l.section="Sospetta endocardite su CIED",l.first=[{label:"Regime empirico (dopo colture)",items:[G("vanco","Vancomicina EV",null),G("cefepime","Cefepime",null)],all:!0}],l.banners.push({tone:"red",title:"Regola cardine CIED",lines:["Infezione del CIED = rimozione completa del sistema (generatore + tutti i lead, inclusi lead abbandonati), idealmente entro 3 giorni dalla diagnosi, senza attendere la sterilizzazione delle colture (EHRA consensus, AHA 2024)."]}),o&&l.notes.push("Allergia severa: il cefepime è un beta-lattamico — valutare l'alternativa con infettivologo/allergologo.")),l.notes.push("Passare alla terapia mirata appena disponibili isolamento e antibiogramma (FilmArray sul flacone positivo)."),l.notes.push("Scelta multidisciplinare (infettivologo + cardiologo); consulto cardiochirurgico esterno precoce se possibile indicazione chirurgica."),l.notes.push("‡ Revisione infettivologica a 48–72 h (senza pre-autorizzazione). † Sola prescrizione infettivologica."),l.diag=zu,l}const ml=[{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"strep",name:"Streptococchi orali e gruppo S. gallolyticus",blocks:[{title:"Penicillino-sensibili (MIC ≤ 0,125 mg/L) — 4 settimane NVE, 6 PVE",items:[G("ceftriaxone","Ceftriaxone","2 g EV q24h")],note:"AHA 2026 non aggiunge gentamicina; ESC 2023 la prevede solo nel regime breve di 2 settimane (NVE non complicata)."},{title:"Sensibilità intermedia (MIC > 0,25–2 mg/L)",items:[G("ceftriaxone","Ceftriaxone","2 g EV q24h in monoterapia, se ceftriaxone-sensibile")],note:"Consenso AHA 2026. ESC 2023: ampicillina ad alte dosi + gentamicina per 2 settimane."},{title:"Penicillino-resistenti (MIC ≥ 4 mg/L)",items:[G("ceftriaxone","Ceftriaxone","2 g EV q24h"),G("genta","+ Gentamicina","3 mg/kg/die per le prime 2 settimane (TDM)")],all:!0},{title:"Allergia ai beta-lattamici",items:[G("vanco","Vancomicina EV","30 mg/kg/die in 2 dosi (TDM)")]}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"efs",name:"Enterococcus faecalis",sub:"Ampicillino-sensibile — 6 settimane anche su valvola nativa",blocks:[{title:"Prima scelta — 6 settimane",items:[G("amox","Ampicillina","2 g EV q4h"),G("ceftriaxone","+ Ceftriaxone","2 g EV q12h")],all:!0,note:"Combinazione preferita, senza aminoglicoside. La monoterapia ha un alto tasso di recidiva. Colonscopia ragionevole."},{title:"Alternativa",items:[G("amox","Ampicillina",null),G("genta","+ Gentamicina","3 mg/kg/die (TDM; più nefrotossico)")],all:!0},{title:"Allergia o resistenza ai beta-lattamici",items:[G("vanco","Vancomicina EV","30 mg/kg/die"),G("genta","+ Gentamicina","3 mg/kg/die (TDM)")],all:!0,note:"Alternative: daptomicina‡ 10–12 mg/kg/die o linezolid‡ 600 mg q12h."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"efm",name:"E. faecium vancomicino-resistente",sub:"Consulenza infettivologica obbligatoria",blocks:[{title:"Terapia",items:[G("dapto","Daptomicina‡","10–12 mg/kg/die + β-lattamico (ampicillina, ceftarolina‡ o ertapenem‡)"),G("linezolid","Linezolid‡","600 mg q12h")],note:"Fosfomicina EV‡ se β-lattamico controindicato. Vancomicina non indicata."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"mssa",name:"S. aureus sensibile (MSSA)",blocks:[{title:"NVE — 4 settimane",items:[G("fluclox","Oxacillina","12 g/die EV in 4–6 dosi"),G("cefazolina","Cefazolina","6 g/die EV in 3 dosi")],note:"No gentamicina, no rifampicina. Nella NVE operata è ragionevole proseguire la monoterapia."},{title:"PVE — ≥ 6 settimane",items:[G("fluclox","Oxacillina o cefazolina",null),G("rifa","+ Rifampicina","900 mg/die in 2–3 dosi, dopo negativizzazione delle emocolture")],all:!0,note:"Gentamicina: non di routine (AHA 2026 la sconsiglia; ESC 2023 la prevede per 2 settimane). Opzione a giudizio dell'infettivologo solo in caso di sensibilità alla gentamicina su antibiogramma e/o sinergia documentata dal laboratorio, con monitoraggio di funzione renale e livelli. Rifampicina: AHA 2026 senza consenso, scelta multidisciplinare."},{title:"Allergia ai beta-lattamici",items:[G("vanco","Vancomicina EV (TDM)",null),G("dapto","Daptomicina‡","10 mg/kg q24h")],note:"Cefazolina se allergia non anafilattica. Valutare la desensibilizzazione negli allergici severi."},{title:"Step-down orale (casi selezionati)",items:[G("fluclox_os","Flucloxacillina OS","500–1000 mg q6h"),G("rifa","+ Rifampicina","600 mg × 2/die")],all:!0,note:"Dose scelta sul riferimento della dicloxacillina del POET (1 g q6h), valutata caso per caso; solo dopo la fase EV con oxacillina o cefazolina. Alternativa: linezolid‡ + rifampicina."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"mrsa",name:"MRSA e CoNS meticillino-resistenti",blocks:[{title:"NVE — 4–6 settimane",items:[G("vanco","Vancomicina EV","30 mg/kg/die in 2 dosi, AUC 400–600"),G("dapto","Daptomicina‡","10 mg/kg/die (8–12)")],note:"Casi refrattari: ceftarolina‡ 600 mg q8h; daptomicina + β-lattamico o fosfomicina EV‡."},{title:"PVE — ≥ 6 settimane",items:[G("vanco","Vancomicina o daptomicina‡",null),G("rifa","+ Rifampicina","900 mg/die, dopo negativizzazione")],all:!0,note:"Gentamicina come per MSSA su protesi (non di routine)."},{title:"Allergia",text:"Nessun impatto (vancomicina, daptomicina)."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"hacek",name:"HACEK",blocks:[{title:"4 settimane NVE, 6 settimane PVE",items:[G("ceftriaxone","Ceftriaxone","2 g q24h")],note:"Alternative: ampicillina se sensibile; ciprofloxacina‡ 400 mg EV q12h. Step-down orale: levofloxacina 750 mg/die."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"gn",name:"Gram-negativi non-HACEK",sub:"es. P. aeruginosa — chirurgia di norma indicata",blocks:[{title:"≥ 6 settimane: β-lattamico attivo",items:[G("cefepime","Cefepime","2 g q8h"),G("piptazo","Piperacillina/tazobactam","4,5 g q6h"),G("meropenem","Meropenem‡","1 g q8h")],note:"+ fluorochinolone EV‡. Gentamicina non più suggerita per i nuovi breakpoint. Dati aziendali 2025: K. pneumoniae ESBL 67 %, resistente ai carbapenemi 50 % — scelta con l'infettivologo."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"cox",name:"Coxiella burnetii",blocks:[{title:"≥ 18 mesi (con infettivologo)",text:"Doxiciclina + idrossiclorochina (dosi non specificate nel protocollo)."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"fungi",name:"Candida",sub:"Infettivologo obbligatorio",blocks:[{title:"≥ 6 settimane + chirurgia",items:[G("amb","Amfotericina B liposomiale","3–5 mg/kg/die"),G("mica","Micafungina","150 mg/die")],note:"Poi azolo orale dopo negativizzazione; soppressione a lungo termine se non operabile. Flucitosina non in uso in azienda."}]},{group:"Terapia mirata (ESC 2023 / AHA 2026)",id:"neg",name:"Emocolture negative",blocks:[{title:"Indicazione",text:"Sierologie (C. burnetii, Bartonella, Brucella, Legionella, Mycoplasma), galattomannano e β-D-glucano; PCR 16S/18S non disponibile in azienda. Rivalutare con microbiologo prima di allungare terapie empiriche."}]},{group:"Infezioni da CIED",id:"cied",name:"Infezione del CIED",sub:"Regola cardine, diagnosi, empirica",blocks:[{title:"Regola cardine",tone:"red",text:"Infezione del CIED = rimozione completa del sistema (generatore + tutti i lead, inclusi lead abbandonati), in centro con esperienza di estrazione, idealmente entro 3 giorni dalla diagnosi, senza attendere la sterilizzazione delle colture (EHRA consensus, AHA 2024). Trattare solo con antibiotici lasciando il device in sede porta a recidive quasi costanti."},{title:"Eccezione",text:"Infezione superficiale della ferita (ascesso dei punti) senza coinvolgimento della tasca o del device → terapia locale/conservativa con follow-up stretto."},{title:"Diagnosi",list:["Emocolture prima dell'antibiotico (almeno 2 set).","TEE in ogni batteriemia con CIED in sede (valutare lead e valvole); TTE prima.","PET/CT con 18F-FDG: utile per tasca e lead quando l'eco è dubbia (ESC 2023).","Colture della tasca e dei lead alla rimozione; non fare tamponi superficiali di routine (scarsa specificità).","Batteriemia da S. aureus con CIED in sede senza altri focolai = considerare estrazione."]},{title:"Empirica (dopo colture) — passare a mirata entro 48 ore",items:[G("vanco","Vancomicina EV",null),G("cefepime","+ Cefepime",null)],all:!0}]},{group:"Infezioni da CIED",id:"ciedDur",name:"Durata della terapia CIED",sub:"Dal giorno dell'estrazione o dalla prima emocoltura negativa, se successiva",blocks:[{title:"Durata (AHA 2024, EHRA)",list:["Infezione di tasca isolata (purulenta): 10–14 giorni (possibile completamento orale)","Erosione cutanea senza pus: 7–10 giorni","Batteriemia senza vegetazioni (TEE negativo), non-S. aureus: 2 settimane","Batteriemia senza vegetazioni, S. aureus: 4 settimane","Vegetazione isolata sui lead: 2 settimane (4 settimane se S. aureus)","Coinvolgimento valvolare: come l'endocardite valvolare, 4–6 settimane (6 in protesi)"]},{title:"Nuovo impianto (se ancora indicato)",text:"Colture negative da ≥ 72 ore dopo l'estrazione; attendere ≥ 2 settimane se c'erano vegetazioni; sito controlaterale."},{title:"Estrazione impossibile (rischio estremo, rifiuto)",text:"Terapia EV iniziale seguita da soppressione antibiotica a lungo termine con infettivologo."},{title:"Prevenzione",list:["Profilassi peri-procedura all'impianto (cefazolina, secondo protocollo chirurgico aziendale).","Tecnica sterile rigorosa, tasca adeguata, minimizzare lead abbandonati.","Nessuna profilassi antibiotica cronica nei portatori di CIED.","Istruzione del paziente alla dimissione: segnalare subito febbre o modificazioni della tasca."]}]}],If=["Nell'endocardite la durata conta dal giorno di negativizzazione delle colture: anche in AKI, non abbreviare gli schemi basandosi solo sull'eGFR — aggiustare le dosi, non la durata.","Gentamicina: non di routine; se usata (streptococchi resistenti, enterococchi, PVE stafilococcica su decisione dell'infettivologo) TDM obbligatorio, monitorare creatinina e ototossicità; per E. faecalis preferire ampicillina + ceftriaxone.","Vancomicina: carico 25–30 mg/kg, poi 30 mg/kg/die in 2 dosi, TDM con target AUC 400–600; daptomicina 10 mg/kg (8–12).","Ricalcolare l'eGFR ogni 2–3 giorni nelle prime 2 settimane: l'AKI da terapia è frequente e va distinto dalla progressione dell'infezione."],Rf=["Scelta multidisciplinare: in azienda non è attivo un Endocarditis Team formalizzato; valutazione congiunta infettivologo + cardiologo e, secondo il caso, cardiochirurgo consultato fuori azienda.","3 set di emocolture prima dell'antibiotico; terapia empirica subito dopo le emocolture.","Gentamicina non di routine; nella PVE stafilococcica solo a giudizio dell'infettivologo con sensibilità su antibiogramma e/o sinergia documentata dal laboratorio.","Terapia mirata appena disponibili isolamento e antibiogramma; FilmArray sul flacone positivo.","‡ Daptomicina, linezolid, ceftarolina, carbapenemi, fluorochinoloni EV, fosfomicina EV: revisione infettivologica a 48–72 h, senza pre-autorizzazione. † Dalbavancina e oritavancina: sola prescrizione infettivologica.","Epidemiologia locale 2025: MRSA 15,3 % (nessuna copertura anti-MRSA di routine nella NVE comunitaria); K. pneumoniae ESBL 67 % e resistente ai carbapenemi 50 % (copertura anti-Gram-negativi nella PVE precoce/nosocomiale con shock o fattori di rischio, scelta con l'infettivologo).","Due fasi: EV in ricovero, poi orale (POET) o OPAT nei selezionati.","Chirurgia non ritardata: emergenza < 24 h, urgenza 3–5 giorni; nessun rinvio dopo ictus ischemico.","Durata contata dalla prima emocoltura negativa; dopo chirurgia schema AHA 2026 (almeno 14 giorni post-intervento).","Fine terapia: ETT come nuovo basale ed emocolture dopo la sospensione.","Profilassi solo nei pazienti ad alto rischio e procedure odontoiatriche a rischio; clindamicina non più raccomandata.","Follow-up: indici di flogosi a 10 e 20 giorni, rivalutazione infettivologica, ETT 6–12 settimane dopo chirurgia, educazione del paziente e controlli odontoiatrici."],Su=[{tag:"AHA 2026",title:"Infective Endocarditis: Diagnosis, Antibiotic Therapy, and Management — Scientific Statement (DeSimone et al., Circulation 2026)",url:"https://www.ahajournals.org/doi/10.1161/CIR.0000000000001466",tags:[{t:"AHA 2026",url:"https://www.ahajournals.org/doi/10.1161/CIR.0000000000001466"}]},{tag:"ESC 2023",title:"Guidelines for the management of infective endocarditis",links:[{label:"European Heart Journal",url:"https://academic.oup.com/eurheartj/article/44/39/3948/7243107"},{label:'Sintesi ACC "Ten Points"',url:"https://www.acc.org/latest-in-cardiology/ten-points-to-remember/2023/08/29/20/49/2023-esc-guidelines-for-endocarditis-esc-2023"}],tags:[{t:"ESC 2023",url:"https://academic.oup.com/eurheartj/article/44/39/3948/7243107"}]},{tag:"Duke-ISCVID 2023",title:"The 2023 Duke-ISCVID Criteria for Infective Endocarditis — Clin Infect Dis 2023;77:518–526",url:"https://doi.org/10.1093/cid/ciad271",tags:[{t:"Duke-ISCVID",url:"https://doi.org/10.1093/cid/ciad271"}]},{tag:"POET",title:"Partial Oral versus Intravenous Antibiotic Treatment of Endocarditis — N Engl J Med 2019;380:415–424",url:"https://doi.org/10.1056/NEJMoa1808312",tags:[{t:"POET",url:"https://doi.org/10.1056/NEJMoa1808312"}]},{tag:"ESC 2023",title:"Messaggi essenziali (durate, due fasi, chirurgia) — PDF ESC",url:"https://www.escardio.org/static-file/Escardio/Guidelines/Products/Slide%20sets/2023%20Gls/Essential%20Messages_2023%20Endocarditis.pdf",tags:[]},{tag:"EHRA/HRS/ISCVID/ESCMID",title:"Consensus internazionale sulle infezioni da CIED — Europace",url:"https://academic.oup.com/europace/article/23/Supplement_4/iv20/6308157",tags:[{t:"EHRA consensus"},{t:"EHRA"}]},{tag:"AHA 2024",title:"Update on Prevention, Diagnosis and Management of CIED Infections",links:[{label:"Medscape Guideline Essentials",url:"https://reference.medscape.com/cc2/p10/guideline-essentials-2024-aha-update-prevention-diagnosis-2024a10008md"},{label:"Circulation (PDF)",url:"https://www.ahajournals.org/doi/pdf/10.1161/CIR.0000000000001187"}],tags:[{t:"AHA 2024",url:"https://www.ahajournals.org/doi/pdf/10.1161/CIR.0000000000001187"}]}],Ri={ceftriaxone:{name:"Ceftriaxone",g60:"2 g q12h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento"},cefepime:{name:"Cefepime",g60:"2 g q8h",g30:"2 g q12h",g10:"1–2 g q12h",d:"1 g q24h"},ampicillina:{name:"Ampicillina",g60:"2 g q4h",g30:"2 g q6h",g10:"2 g q8h",d:"1–2 g q8h post-dialisi"},meropenem:{name:"Meropenem",g60:"2 g q8h",g30:"2 g q8h",g10:"1 g q12h",d:"0,5–1 g q24h post-dialisi"},vanco:{name:"Vancomicina EV",g60:"25–30 mg/kg carico, poi 15–20 mg/kg q8–12h",g30:"TDM, target trough 15–20 mg/L (SNC)",g10:"Estendere secondo livelli",d:"Estendere q48–96h secondo livelli",tdm:!0},genta:{name:"Gentamicina",g60:"2 mg/kg q8h (o schemi once-daily)",g30:"TDM sempre",g10:"Solo TDM",d:"Solo TDM post-dialisi",tdm:!0},metro:{name:"Metronidazolo",g60:"500 mg q8h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Metà dose post-dialisi"},aciclovir:{name:"Aciclovir",g60:"10 mg/kg q8h",g30:"10 mg/kg q12h",g10:"10 mg/kg q24h",d:"5 mg/kg q24h post-dialisi — idratazione abbondante (nefrotossicità da cristalli)"},tmpsmx:{name:"TMP-SMX",g60:"5 mg/kg (TMP) q8h (dosaggi alti per Nocardia/Listeria)",g30:"Metà dose",g10:"Metà dose q12h",d:"Evitare o metà dose q24h post-dialisi"},rifa:{name:"Rifampicina",g60:"600 mg q24h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento"},linezolid:{name:"Linezolid",g60:"600 mg q12h",g30:"Nessun aggiustamento",g10:"Nessun aggiustamento",d:"Nessun aggiustamento (TDM utile)"},cipro_ev:{name:"Ciprofloxacina EV",g60:"400 mg q8h",g30:"400 mg q8–12h",g10:"400 mg q12h",d:"400 mg q24h"},vorico:{name:"Voriconazolo",g60:"6 mg/kg q12h ×2 dosi, poi 4 mg/kg q12h",g30:"Nessun aggiustamento (evitare la formulazione EV con ciclodestrina se eGFR < 50: preferire OS)",g10:"Nessun aggiustamento (evitare la formulazione EV con ciclodestrina: preferire OS)",d:"Nessun aggiustamento (preferire OS)"}},Na=Object.keys(Ri),Df=["ceftriaxone","cefepime","ampicillina","meropenem","fluclox","cefazolina","aztreonam"],Mf=["Antibiotico + desametasone entro 1 ora dal sospetto/riconoscimento (ESCMID).","Rachicentesi prima dell'antibiotico se non ci sono controindicazioni (compromissione grave della coscienza, deficit neurologici focali, nuove crisi epilettiche, immunodepressione, segni di ipertensione endocranica): prelievo LCS immediato, poi terapia.","Se controindicazioni alla rachicentesi o quadro gravissimo: emocolture + terapia immediata, LCS dopo imaging.","Nessun ritardo per l'imaging quando il quadro clinico è tipico."],Nu=["Desametasone 10 mg EV q6h per 4 giorni, iniziato prima o insieme alla prima dose di antibiotico; se l'antibiotico è già stato dato, si può ancora iniziare entro 4 ore (grade A ESCMID).","Sospendere se la meningite non è batterica o il patogeno non è S. pneumoniae o H. influenzae (in particolare: sospendere in listeriosi).","Il desametasone riduce la penetrazione liquorale della vancomicina — negli schemi con vancomicina considerare di aggiungere rifampicina o passare a meropenem (EpiCentro ISS)."],Cu='Dosi "da SNC": ceftriaxone 2 g q12h, cefepime 2 g q8h, meropenem 2 g q8h, ampicillina 2 g q4h, vancomicina 25–30 mg/kg carico poi 15–20 mg/kg q8–12h con TDM.',yu=["LCS: cellule, formula, proteine, glucosio (con glicemia contemporanea per il rapporto), colorazione di Gram, coltura + antibiogramma; PCR multiplex batterica quando disponibile.","Antigeni urinari (pneumococco, Legionella) se coesiste sospetto di polmonite.","Emocolture prima dell'antibiotico.","Emocolture di controllo solo se patogeno resistente o risposta lenta (non di routine).","Ricerca della porta d'ingresso: otite, sinusite, polmonite, endocardite (valutare sempre!), focolaio dentale."],Au=["Febbre + alterazione dello stato mentale ± crisi epilettiche, segni neurologici focali.","Aciclovir EV entro 6 ore dal sospetto, non aspettare la diagnostica (infografica EAN/ESCMID).","RM cerebrale (preferita alla TC) + LCS (PCR HSV-1/2, VZV, enterovirus, panel multiplex se disponibile — ma non escludere l'HSV sulla sola base del panel multiplex: richiedere PCR HSV dedicata se il sospetto persiste).","Ricercare cause non infettive: encefalite autoimmune (anti-NMDAR e pannello autoanticorpale su LCS), metaboliche, tossiche.","Screening infettivo mirato sull'epidemiologia: zecche (TBE, rickettsie), viaggi, immunodepressione (CMV, EBV, HHV-6, Toxoplasma, JC virus), HIV, influenza stagionale."],Eu=["Diagnosi alternativa confermata o basso sospetto clinico di HSE","PCR HSV su LCS negativa (se il prelievo è stato fatto > 72 ore dall'esordio neurologico)","Cellule bianche nel LCS normali","RM senza anomalie del lobo temporale"],ku=["RM cerebrale con gadolinio + sequenze di diffusione (DWI/ADC): imaging di prima scelta (TC solo se RM non disponibile) (ESCMID 2024).","Cercare la fonte: sinusite, otite, focolaio dentale, endocardite, polmonite/empiema, infezione cutanea, trauma; valutare sempre ecocardiogramma ed esame odontoiatrico.","Aspirazione o escissione chirurgica raccomandata sempre che tecnicamente fattibile (diagnostica + terapeutica; mortalità inferiore al trattamento conservativo).","Nei pazienti non gravi, se la neurochirurgia è possibile entro ~24 ore, gli antibiotici possono essere differiti fino all'aspirato (per non sterilizzare i campioni).","Diagnostica molecolare (PCR 16S/18S, mNGS) se le colture sono negative."],wu=["Aspirato o trattamento conservativo: 6–8 settimane di terapia EV (raccomandazione condizionale).","Escissione completa: possibile 4 settimane.","Non raccomandato il passaggio orale precoce, né il consolidamento orale di routine dopo 6 settimane EV.","RM di controllo ogni ~2 settimane fino alla guarigione clinica, poi a fine terapia.","Desametasone solo se edema perilesionale con sintomi neurologici gravi o rischio di erniazione (non di routine).","Nessuna profilassi antiepilettica di routine (trattare le crisi se si verificano)."], 0 % in alcune casistiche) ed Enterobacterales ESBL."],Gv=[["Precedente infezione o colonizzazione da MRSA","Negli ultimi 12 mesi; il fattore più predittivo"],["Elevata prevalenza locale di MRSA","≥ 50 % per le lievi e ≥ 30 % per le moderate (IDSA 2012). Dato aziendale specifico per DFI non disponibile; nel 2025 MRSA circa 15 % sugli isolati da emocoltura: la copertura empirica si basa sugli altri fattori individuali"],["Infezione grave","Copertura empirica anti-MRSA in attesa delle colture"],["Ricovero ospedaliero recente","Negli ultimi 3–12 mesi"],["Residenza in RSA o lungodegenza",""],["Terapia antibiotica recente","Negli ultimi 3 mesi, in particolare fluorochinoloni"],["Emodialisi o insufficienza renale cronica avanzata",""],["Ulcera di lunga durata od osteomielite",""],["Dispositivi invasivi","CVC, catetere vescicale"],["Uso di sostanze per via endovenosa","Fattore di rischio per MRSA comunitario"]],Uv="Fattori di rischio per P. aeruginosa: isolamento dalla stessa sede nelle settimane precedenti, macerazione della lesione, frequente esposizione del piede all'acqua (pediluvi, bendaggi umidi), infezione moderata/grave dopo antibiotici ad ampio spettro. In assenza di questi la copertura empirica antipseudomonas non è indicata (IWGDF/IDSA 2023).",$v=["La diagnosi di DFI è clinica: niente indagini microbiologiche su ulcere senza segni di infezione; un germe isolato da un'ulcera non infetta NON va trattato, né con antibiotici sistemici né topici.","Campione tissutale (curettage o biopsia della base dell'ulcera, agoaspirato di raccolte) dopo detersione e rimozione del necrotico, preferito al tampone superficiale (il tampone raccoglie la flora colonizzante: concordanza con l'isolamento bioptico circa 30 %).","Invio rapido in Microbiologia in contenitore sterile, con informazioni cliniche, tipo di campione e sede.","Coltura convenzionale come prima linea; le tecniche molecolari non sostituiscono la coltura.","Sospetta osteomielite: campione osseo per coltura ed esame istologico.","Febbre o coinvolgimento sistemico: 2 set di emocolture prima dell'antibiotico (bundle aziendale sepsi)."],Bv=[["1 — Non infetta","Nessun segno o sintomo locale o sistemico di infezione"],["2 — Lieve","Almeno 2 tra: tumefazione o indurimento; eritema 0,5–2 cm attorno all'ulcera; dolorabilità o dolore; calore; secrezione purulenta. Solo cute e sottocute. Escluse altre cause (trauma, gotta, Charcot acuto, frattura, trombosi, stasi venosa)"],["3 — Moderata","Senza segni sistemici, con eritema ≥ 2 cm e/o coinvolgimento di strutture profonde (ascesso, tendine, muscolo, articolazione, osso)"],["4 — Grave","Qualsiasi infezione con ≥ 2 criteri SIRS: T > 38 °C o < 36 °C; FC > 90/min; FR > 20/min o PaCO₂ < 32 mmHg; leucociti > 12.000 o < 4.000/mm³ o > 10 % forme immature"],["Osteomielite",'Aggiungere "(O)": 3(O) o 4(O). Osteomielite senza ≥ 2 segni infiammatori: 3(O) se < 2 criteri SIRS, 4(O) se ≥ 2']],Hv=[["Grado 0","Lesione pre- o post-ulcerativa completamente epitelizzata"],["Grado I","Ulcera superficiale, senza tendine, capsula od osso"],["Grado II","Ulcera che raggiunge tendine o capsula articolare"],["Grado III","Ulcera che raggiunge osso o articolazione"],["Stadio A / B / C / D","A non infetta non ischemica · B infetta · C ischemica · D infetta e ischemica. Il rischio di amputazione cresce con grado e stadio, massimo negli stadi D"]],Qv=["Lesione: dimensioni dell'ulcera e dell'eritema, edema, essudato, dolore. Sospetto di infezione necrotizzante (dolore sproporzionato, crepitio, bolle, necrosi o ecchimosi, rapida progressione) = chirurgia d'urgenza.","Arto: polsi femorale, popliteo, tibiali; ABI o indice alluce-braccio. Arto ischemico: valutazione urgente del chirurgo vascolare.","Paziente: emocromo, PCR, VES, procalcitonina (se clinica dubbia), lattati, EGA, creatinina, AST, ALT, Na, K, bilirubina, PT/INR, glicemia, HbA1c.","PCR, VES o procalcitonina aiutano quando l'esame clinico è dubbio (PAD, neuropatia). Temperatura cutanea e colture quantitative non vanno usate per diagnosticare l'infezione."],Wv=["Esami iniziali: probe-to-bone, radiografia, VES/PCR/PCT. Probe-to-bone: sensibilità 66–87 %, specificità 85–91 %, VPN fino al 98 %. VES > 70 mm/h aumenta la probabilità di osteomielite.","Radiografia in più proiezioni come primo esame; se negativa con sospetto persistente, ripeterla dopo 2–4 settimane.","RMN se la diagnosi resta dubbia. Se controindicata o non disponibile: PET/TC 18F-FDG, scintigrafia con leucociti marcati (preferibilmente SPECT/TC) o con anticorpi antigranulocitari.","Campione osseo (percutaneo o intraoperatorio) per coltura e istologia se la diagnosi è incerta, serve il patogeno con antibiogramma o manca la risposta; se possibile dopo almeno 14 giorni senza antibiotici.","Sospetta infezione necrotizzante o raccolte profonde: TC o RMN urgenti, senza ritardare la valutazione chirurgica."],Kv="Ricovero: tutte le infezioni gravi e le moderate con comorbidità rilevanti (in particolare PAD). Nelle lievi/moderate anche per osteomielite che richieda accertamenti, scompenso metabolico, terapia parenterale non gestibile a domicilio, scarsa aderenza o fragilità psico-sociale.",Yv=["Consulenza chirurgica urgente (ortopedia e/o chirurgia vascolare a seconda del caso) nelle infezioni gravi e nelle moderate con gangrena estesa, infezione necrotizzante, ascesso profondo, sindrome compartimentale o ischemia grave dell'arto.","Fascite necrotizzante, gangrena gassosa e ascessi profondi: chirurgia in emergenza, cardine della terapia.","Chirurgia precoce (entro 24–48 h) con l'antibiotico nelle infezioni moderate e gravi, per rimuovere tessuto infetto e necrotico.","PAD con ulcera infetta o gangrena: valutazione chirurgica e vascolare urgente per i tempi di drenaggio e rivascolarizzazione.","Osteomielite: considerare la resezione dell'osso infetto. Nell'avampiede senza urgenza di drenaggio, senza PAD e senza osso esposto è possibile la sola terapia antibiotica; scelta multidisciplinare.","Dopo resezione o amputazione: sempre biopsia del margine osseo prossimale (coltura e istologia), che decide la durata."],Xv=["Non trattare con antibiotici, sistemici o topici, le ulcere clinicamente non infette, né per prevenire l'infezione né per favorire la guarigione.","Regimi di efficacia dimostrata a dosi standard; scelta su patogeni probabili o documentati, gravità, evidenze, eventi avversi, interazioni, disponibilità e costi.","Spettro più ristretto e durata minima efficaci. Nelle lievi senza antibiotici recenti: solo Gram positivi aerobi (MRSA solo se fattori di rischio).","Non coprire empiricamente P. aeruginosa senza i fattori di rischio specifici.","Infezioni gravi: terapia parenterale iniziale; nel quadro settico iniziare il prima possibile, dopo le emocolture (procedura aziendale sepsi).","Rivalutare ogni 24–48 h e de-escalare sugli isolati. Lievi e gran parte delle moderate per os dall'inizio; nelle altre passaggio orale appena il quadro migliora, anche nell'osteomielite."],Jv="Sconsigliati a scopo antinfettivo (IWGDF/IDSA 2023): G-CSF; antisettici topici, argento, miele, batteriofagi, terapia a pressione negativa; antibiotici topici (spugne, creme, cementi) associati alla sistemica; ossigenoterapia iperbarica o topica. Restano le indicazioni per la guarigione delle lesioni (Allegato 4 del documento).",Zv=[["Tessuti molli (lieve, moderata o grave)","1–2 settimane","Forte / alta"],["Tessuti molli con infezione estesa, risoluzione lenta o PAD grave","Fino a 3–4 settimane","Condizionale / bassa"],["Tessuti molli non risolti dopo 4 settimane","Rivalutare: nuovi campioni, imaging, valutazione chirurgica e vascolare","Forte / bassa"],["Osteomielite senza resezione né amputazione","6 settimane","Condizionale / bassa"],["Osteomielite dopo amputazione minore con margine osseo positivo","Fino a 3 settimane","Condizionale / bassa"],["Resezione completa, margine negativo, senza infezione residua dei tessuti molli","Pochi giorni (2–5) dopo l'intervento","Expert opinion"]],eb=["Osteomielite trattata solo con antibiotici: senza miglioramento entro 2–4 settimane, rivalutazione (nuovo campione osseo, imaging, chirurgia). Con buona risposta non prolungare oltre 6 settimane.","Remissione dell'osteomielite definita solo dopo almeno 6 mesi di follow-up dalla fine della terapia.","Passaggio orale appena il quadro migliora, in genere dopo 5–7 giorni di terapia mirata efficace, anche nell'osteomielite, con molecole ad alta biodisponibilità."],ib=[{item:$("amc_os","Amoxicillina/clavulanato","875/125 mg q8h"),note:"Streptococchi, MSSA, Enterobacterales sensibili, anaerobi; penetrazione ossea modesta"},{item:$("fluclox_os","Flucloxacillina","1 g q6–8h"),note:"MSSA e streptococchi, soprattutto tessuti molli"},{item:$("cotrim","Cotrimossazolo","160/800 mg: 2 cp q12h (osso); 1–2 cp q12h (tessuti molli)"),note:"MSSA, MRSA, Enterobacterales; streptococchi poco coperti; controllare potassio e creatinina"},{item:$("doxy","Doxiciclina","100 mg q12h"),note:"MSSA, MRSA; streptococchi variabili"},{item:$("clinda","Clindamicina","450–600 mg q8h"),note:"Streptococchi, stafilococchi sensibili, anaerobi; verificare la resistenza inducibile"},{item:$("levo","Levofloxacina","750 mg q24h"),note:"Enterobacterales; non in monoterapia per S. aureus"},{item:$("cipro_os","Ciprofloxacina","750 mg q12h"),note:"Enterobacterales, P. aeruginosa"},{item:$("linezolid","Linezolid","600 mg q12h"),note:"MRSA, streptococchi; mielotossicità e neuropatia oltre 2–4 settimane: emocromo settimanale"},{item:$("rifa","Rifampicina","600 mg/die (o 450 mg q12h)"),note:"Solo in associazione; non raccomandata di routine, decisione dell'infettivologo; interazioni farmacologiche"}],Wp=[["lieve","Lieve (grado 2)","Solo cute e sottocute, eritema 0,5–2 cm"],["mod","Moderata (grado 3)","Eritema ≥ 2 cm o strutture profonde, senza SIRS"],["grave","Grave (grado 4)","≥ 2 criteri SIRS"],["osteo","Osteomielite (O)","Sospetta o documentata"]],tb={lieve:"Durata: 1–2 settimane (fino a 3–4 se risoluzione lenta o PAD grave; rivalutare "]],drugs:[["Principali opzioni ospedaliere, da scegliere secondo la sede","Vancomicina; teicoplanina; linezolid; daptomicina; ceftarolina (IDSA infezioni cutanee, linee guida UK MRSA)."],["Altra cefalosporina anti-MRSA, per indicazioni selezionate","Ceftobiprolo (linee guida UK MRSA)."],["Soprattutto infezioni di cute e tessuti molli, in casi selezionati","Dalbavancina; tedizolid (IDSA infezioni cutanee)."],["Opzioni orali per infezioni cutanee selezionate, se sensibilità attesa/documentata","Cotrimossazolo; doxiciclina; minociclina; clindamicina; linezolid (sintesi delle raccomandazioni IDSA MRSA)."]],remember:"Nella polmonite le opzioni abituali sono vancomicina o linezolid; la daptomicina non va usata per la polmonite alveolare perché inattivata dal surfattante (ATS/IDSA HAP-VAP, AAFP). Per la clindamicina verificare la resistenza inducibile quando indicato; le opzioni orali per infezioni cutanee non sono sostituti automatici della terapia della batteriemia (AAFP sulle infezioni cutanee, sintesi IDSA MRSA)."},{id:"pae",name:"Pseudomonas aeruginosa",tone:"blue",risks:[["Precedente isolamento","Infezione o colonizzazione da Pseudomonas, soprattutto nella stessa sede (IDSA percorso CAP)."],["Polmonite ospedaliera o associata a ventilazione","La copertura antipseudomonas fa parte del regime empirico; antibiotici endovena recenti e shock aumentano il rischio di resistenza (ATS/IDSA HAP-VAP)."],["Patologia polmonare strutturale avanzata","In particolare bronchiectasie o fibrosi cistica; nella CAP grave considerare anche ricovero e antibiotici endovena recenti, secondo i fattori validati localmente (IDSA percorso CAP)."],["Neutropenia febbrile ad alto rischio","Prevedere un regime empirico con attività antipseudomonas, secondo il modulo dedicato (IDSA infezioni cutanee, sezione sul paziente neutropenico)."]],drugs:[["Beta-lattamici tradizionali","Piperacillina/tazobactam; cefepime; ceftazidime; aztreonam; meropenem; imipenem/cilastatina (IDSA AMR)."],["Fluorochinoloni, se sensibile","Ciprofloxacina; levofloxacina (IDSA AMR)."],["Aminoglicosidi, per impieghi selezionati","Amikacina; tobramicina (IDSA AMR)."],["Opzioni per ceppi resistenti, secondo antibiogramma e consulenza infettivologica","Ceftolozano/tazobactam; ceftazidime/avibactam; imipenem/cilastatina/relebactam; cefiderocol (IDSA AMR)."],["Riserva, se alternative migliori non disponibili o non attive","Colistina, con impiego specialistico (IDSA AMR)."]],remember:"L'attività non è garantita dal nome della classe e va verificata sull'antibiogramma; gli aminoglicosidi non sono una monoterapia abituale per le infezioni extraurinarie. La doppia copertura può servire inizialmente in pazienti selezionati ad alto rischio, ma non va mantenuta automaticamente se è documentato un beta-lattamico attivo (IDSA AMR, ATS/IDSA HAP-VAP)."},{id:"ana",name:"Anaerobi",tone:"slate",risks:[["Focolaio addominale o pelvico","Perforazione intestinale, peritonite, ascesso intra-addominale o pelvico (MSD, infezioni anaerobiche miste)."],["Focolaio orale o profondo","Ascesso odontogeno, infezioni profonde del collo, ascesso cerebrale, ascesso polmonare o empiema (MSD, infezioni anaerobiche miste)."],["Necrosi o ischemia","Infezioni necrotizzanti, gangrena, lesioni infette ischemiche o da pressione; gas nei tessuti e materiale maleodorante sono indizi, non prove definitive (MSD, infezioni anaerobiche miste)."]],drugs:[["Nitroimidazoli","Metronidazolo (MSD)."],["Beta-lattamici con inibitore","Amoxicillina/acido clavulanico; ampicillina/sulbactam; piperacillina/tazobactam (MSD)."],["Carbapenemi","Meropenem; imipenem/cilastatina; ertapenem (MSD)."],["Alternative selezionate, non equivalenti per affidabilità e sede","Clindamicina; tigeciclina; eravaciclina; moxifloxacina (MSD)."]],remember:"Il metronidazolo non copre gli aerobi e, nelle infezioni miste, richiede un partner appropriato; aggiungerlo a piperacillina/tazobactam o a un carbapenemico costituisce generalmente una duplicazione non necessaria. La clindamicina non è una copertura empirica affidabile del gruppo Bacteroides fragilis (MSD)."},{id:"can",name:"Candida spp.",tone:"violet",risks:[["Sepsi o shock senza spiegazione alternativa","Soprattutto nel paziente critico con più fattori di rischio associati, non per la sola febbre persistente (IDSA candidiasi)."],["Addome ad alto rischio","Chirurgia addominale recente con deiscenza anastomotica, perforazioni gastrointestinali ricorrenti o pancreatite necrotizzante (IDSA candidiasi)."],["Fattori cumulativi","CVC, nutrizione parenterale, antibiotici ad ampio spettro, dialisi, corticosteroidi/immunodepressione e colonizzazione da Candida, da interpretare insieme al quadro clinico (IDSA candidiasi)."]],drugs:[["Prima scelta abituale per candidemia e sospetta candidiasi invasiva nel paziente instabile","Echinocandine: anidulafungina; caspofungina; micafungina; rezafungina, se disponibile in prontuario (linea guida globale ECMM/ISHAM/ASM 2025)."],["Pazienti selezionati o terapia di prosecuzione, secondo specie e sensibilità","Fluconazolo; voriconazolo in indicazioni selezionate (IDSA candidiasi)."],["Alternativa per resistenza/intolleranza o localizzazioni specifiche","Amfotericina B liposomiale (IDSA candidiasi)."],["Impiego specialistico, generalmente in associazione","Flucitosina (IDSA candidiasi)."]],remember:"La sola colonizzazione non giustifica una terapia sistemica; Candida nelle secrezioni respiratorie e la candiduria asintomatica di solito non si trattano, salvo specifiche eccezioni. Le echinocandine non sono la scelta abituale per infezioni urinarie, oculari o del sistema nervoso centrale; il fluconazolo non è affidabile contro tutte le specie, rendendo essenziali identificazione e antifungigramma (IDSA candidiasi, linea guida globale 2025)."},{id:"cre",name:"Enterobatteri resistenti ai carbapenemi (CRE)",short:"CRE",tone:"amber",risks:[["Colonizzazione o infezione pregressa","CRE isolati nei 6 mesi precedenti (anche tampone rettale di screening): considerare il microrganismo e il suo antibiogramma nella scelta empirica (IDSA AMR)."],["Esposizione antibiotica recente","Antibiotici ad ampio spettro, in particolare carbapenemi, nei 30 giorni precedenti (IDSA AMR)."],["Epidemiologia aziendale","Dati microbiologici aziendali 2025 sulle batteriemie: K. pneumoniae resistente ai carbapenemi 49,7 % (ESBL 67,3 %). Nel paziente grave colonizzato o proveniente da setting ad alta prevalenza la copertura va discussa con l'infettivologo."]],drugs:[["KPC (o carbapenemasi non ancora caratterizzata, secondo epidemiologia)","Meropenem/vaborbactam; ceftazidime/avibactam; imipenem/cilastatina/relebactam. Alternativa: cefiderocol (IDSA AMR)."],["OXA-48 e simili","Ceftazidime/avibactam. Alternativa: cefiderocol (IDSA AMR)."],["Metallo-beta-lattamasi (NDM, VIM, IMP)","Aztreonam/avibactam, disponibile in azienda (EMA Emblaveo). Alternative: ceftazidime/avibactam + aztreonam somministrati insieme, oppure cefiderocol (IDSA AMR)."],["Cistite, se sensibile","Ciprofloxacina; levofloxacina; cotrimossazolo; amikacina in dose singola (IDSA AMR)."],["Infezioni intra-addominali, come alternativa","Tigeciclina; eravaciclina: non per batteriemie né infezioni urinarie (IDSA AMR)."],["Riserva","Colistina: da evitare, salvo cistite senza alternative (IDSA AMR)."]],remember:"Chiedere sempre alla Microbiologia il tipo di carbapenemasi (test rapidi molecolari o immunocromatografici): la scelta del farmaco dipende dal meccanismo. Una volta nota la sensibilità a un nuovo beta-lattamico la terapia di combinazione non è raccomandata di routine. Farmaci a prescrizione infettivologica (IDSA AMR)."},{id:"dtr",name:"P. aeruginosa resistente ai carbapenemi / DTR",short:"Pseudo-monas DTR",tone:"emerald",risks:[["Isolamento pregresso","P. aeruginosa resistente ai carbapenemi o DTR nei 6 mesi precedenti, nella stessa sede o come colonizzazione (IDSA AMR)."],["Esposizione antibiotica recente","Carbapenemi o altri antipseudomonas nei 30 giorni precedenti (IDSA AMR)."],["Definizione DTR","Non sensibile a piperacillina/tazobactam, ceftazidime, cefepime, aztreonam, meropenem, imipenem, ciprofloxacina e levofloxacina (IDSA AMR)."]],drugs:[["Resistente ai carbapenemi ma sensibile a beta-lattamici tradizionali","Il beta-lattamico tradizionale attivo (piperacillina/tazobactam, ceftazidime, cefepime), in infusione prolungata (IDSA AMR)."],["DTR, infezioni extraurinarie","Ceftolozano/tazobactam; ceftazidime/avibactam; imipenem/cilastatina/relebactam. Alternativa: cefiderocol (IDSA AMR)."],["Produttore di carbapenemasi (metallo-beta-lattamasi)","Cefiderocol (IDSA AMR)."],["Infezioni urinarie","Le stesse opzioni; amikacina una volta al giorno come alternativa nella pielonefrite e nelle IVU complicate (IDSA AMR)."],["Riserva","Colistina: solo cistite senza alternative (IDSA AMR)."]],remember:"Se il ceppo è sensibile a un nuovo beta-lattamico la terapia di combinazione non è raccomandata. Verificare sempre l'antibiogramma: la sensibilità ai nuovi beta-lattamici varia tra ceppi. Farmaci a prescrizione infettivologica (IDSA AMR)."},{id:"crab",name:"Acinetobacter baumannii resistente ai carbapenemi (CRAB)",short:"CRAB",tone:"rose",risks:[["Colonizzazione o infezione pregressa","CRAB isolato nei 6 mesi precedenti (IDSA AMR)."],["Contesto","Terapia intensiva, ventilazione meccanica, ustioni e ferite complesse; distinguere sempre colonizzazione e infezione, soprattutto nelle vie respiratorie e sulle ferite (IDSA AMR)."]],drugs:[["Prima scelta in azienda","Ampicillina/sulbactam ad alto dosaggio di sulbactam, in associazione ad almeno un altro farmaco attivo: colistina, tigeciclina o cefiderocol (IDSA AMR). Alto dosaggio: necessario consulto infettivologico. Sulbactam/durlobactam, preferito da IDSA, non è disponibile al Policlinico."],["Uso limitato","Cefiderocol: solo in caso di intolleranza o resistenza agli altri farmaci, sempre in associazione (IDSA AMR)."]],remember:"Nel CRAB la terapia di combinazione è raccomandata, anche quando un solo farmaco è
