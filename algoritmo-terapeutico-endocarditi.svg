<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 760 1124" role="img" aria-label="Terapia empirica e consulto cardiochirurgico partono insieme" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="tx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1e293b">Terapia empirica e consulto cardiochirurgico partono insieme</text><text x="24" y="48" fill="#64748b">Allegato 2 – Algoritmo terapeutico</text><g fill="none" stroke="#94a3b8" stroke-width="1.25"><path d="M344 96H432" marker-end="url(#tx-arrow)"></path><path d="M220 120V140"></path><path d="M192 140H568"></path><path d="M192 140V164" marker-end="url(#tx-arrow)"></path><path d="M568 140V164" marker-end="url(#tx-arrow)"></path><path d="M192 268V292" marker-end="url(#tx-arrow)"></path><path d="M24 216H12V472H24" marker-end="url(#tx-arrow)"></path><path d="M360 344H376"></path><path d="M360 472H376"></path><path d="M376 344V588H256" marker-end="url(#tx-arrow)"></path><path d="M192 624V640"></path><path d="M100 640H284"></path><path d="M100 640V656" marker-end="url(#tx-arrow)"></path><path d="M284 640V656" marker-end="url(#tx-arrow)"></path><path d="M100 728V772" marker-end="url(#tx-arrow)"></path><path d="M284 744V772" marker-end="url(#tx-arrow)"></path><path d="M192 876V900" marker-end="url(#tx-arrow)"></path><path d="M192 972V996" marker-end="url(#tx-arrow)"></path><path d="M408 268V776"></path><path d="M408 328H424" marker-end="url(#tx-arrow)"></path><path d="M408 440H424" marker-end="url(#tx-arrow)"></path><path d="M408 560H424" marker-end="url(#tx-arrow)"></path><path d="M408 664H424" marker-end="url(#tx-arrow)"></path><path d="M408 776H424" marker-end="url(#tx-arrow)"></path><path d="M580 820V936H360" marker-end="url(#tx-arrow)"></path></g><g><rect x="96" y="72" width="248" height="48" rx="8" fill="#1d4ed8" fill-opacity="0.12" stroke="#1d4ed8" stroke-width="2"></rect><text x="220" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Endocardite certa o possibile</text></g><g><rect x="432" y="60" width="304" height="72" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="444" y="84" font-size="13" font-weight="600" fill="#1e293b">In parallelo</text><text x="444" y="100" fill="#1e293b">Ricerca di emboli e porta d&#x27;ingresso</text><text x="444" y="116" fill="#1e293b">Colonscopia se S. gallolyticus o E. faecalis</text></g><g><rect x="24" y="164" width="336" height="104" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="188" font-size="13" font-weight="600" fill="#1e293b">Terapia antibiotica empirica</text><text x="36" y="204" fill="#1e293b">Subito dopo le emocolture</text><text x="36" y="220" fill="#1e293b">Battericida, e.v., ad alte dosi</text><text x="36" y="236" fill="#1e293b">Durata dalla prima emocoltura negativa</text><text x="36" y="252" fill="#64748b">Dosaggi: scheda Empirica</text></g><g><rect x="24" y="292" width="336" height="104" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="316" font-size="13" font-weight="600" fill="#1e293b">NVE o PVE tardiva (≥ 12 mesi)</text><text x="36" y="332" fill="#1e293b">Ampicillina 12 g/die + ceftriaxone 4 g/die</text><text x="36" y="348" fill="#1e293b">oppure ampicillina + flucloxacillina 12 g/die</text><text x="36" y="364" fill="#1e293b">Allergia: cefazolina 6 g/die o vancomicina</text><text x="36" y="380" font-weight="600" fill="#1e293b">Senza gentamicina</text></g><g><rect x="24" y="412" width="336" height="120" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="436" font-size="13" font-weight="600" fill="#1e293b">PVE precoce (&lt; 12 mesi) o nosocomiale</text><text x="36" y="452" fill="#1e293b">Vancomicina 30 mg/kg/die in 2 dosi (TDM)</text><text x="36" y="468" fill="#1e293b">o daptomicina‡ 10 mg/kg/die</text><text x="36" y="484" fill="#1e293b">+ rifampicina 900 mg/die se protesi, dopo</text><text x="36" y="500" fill="#1e293b">negativizzazione; senza gentamicina</text><text x="36" y="516" fill="#1e293b">Gram-negativi se shock o fattori di rischio</text></g><g><polygon points="128,588 192,552 256,588 192,624" fill="none" stroke="#94a3b8" stroke-width="1.25"></polygon><text x="192" y="592" text-anchor="middle" font-size="13" fill="#1e293b">Emocolture</text></g><g><rect x="24" y="656" width="152" height="72" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="680" font-size="13" font-weight="600" fill="#1e293b">Positive</text><text x="36" y="696" fill="#1e293b">Terapia mirata</text><text x="36" y="712" fill="#64748b">(scheda Mirata)</text></g><g><rect x="208" y="656" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="220" y="680" font-size="13" font-weight="600" fill="#1e293b">Negative</text><text x="220" y="696" fill="#1e293b">Prosegue l&#x27;empirica:</text><text x="220" y="712" fill="#1e293b">4 settimane NVE,</text><text x="220" y="728" fill="#1e293b">6 settimane PVE</text></g><g><rect x="24" y="772" width="336" height="104" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="796" font-size="13" font-weight="600" fill="#1e293b">Step-down orale o OPAT</text><text x="36" y="812" fill="#1e293b">Casi selezionati, dopo ≥ 10 gg e.v.</text><text x="36" y="828" fill="#1e293b">(≥ 7 gg dopo chirurgia), stabili</text><text x="36" y="844" fill="#1e293b">ETE entro 2 gg dal passaggio</text><text x="36" y="860" fill="#1e293b">Dalbavancina† o oritavancina† nell&#x27;OPAT</text></g><g><rect x="24" y="900" width="336" height="72" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="924" font-size="13" font-weight="600" fill="#1e293b">Fine terapia</text><text x="36" y="940" fill="#1e293b">ETT come nuovo basale</text><text x="36" y="956" fill="#1e293b">Emocolture dopo la sospensione</text></g><g><rect x="400" y="164" width="336" height="104" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="412" y="188" font-size="13" font-weight="600" fill="#1e293b">Consulto cardiochirurgico esterno</text><text x="412" y="204" fill="#1e293b">Precoce; trasferimento concordato caso per caso</text><text x="412" y="220" fill="#1e293b">Emergenza &lt; 24 h; urgenza 3–5 giorni</text><text x="412" y="236" fill="#1e293b">(AHA: chirurgia precoce entro 48–72 h)</text><text x="412" y="252" fill="#1e293b">Non urgente: durante lo stesso ricovero</text></g><g><rect x="424" y="292" width="312" height="72" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="436" y="316" font-size="13" font-weight="600" fill="#1e293b">Scompenso cardiaco</text><text x="436" y="332" fill="#1e293b">Edema refrattario o shock: emergenza</text><text x="436" y="348" fill="#1e293b">Scompenso sintomatico: urgenza</text></g><g><rect x="424" y="380" width="312" height="120" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="436" y="404" font-size="13" font-weight="600" fill="#1e293b">Infezione non controllata</text><text x="436" y="420" fill="#1e293b">Ascesso, pseudoaneurisma, fistola, nuovo BAV</text><text x="436" y="436" fill="#1e293b">Vegetazione in crescita, deiscenza protesica</text><text x="436" y="452" fill="#1e293b">Funghi o germi MDR</text><text x="436" y="468" fill="#1e293b">Emocolture positive dopo 1 settimana</text><text x="436" y="484" fill="#1e293b">PVE da S. aureus o Gram-negativi non-HACEK</text></g><g><rect x="424" y="516" width="312" height="88" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="436" y="540" font-size="13" font-weight="600" fill="#1e293b">Prevenzione embolica</text><text x="436" y="556" fill="#1e293b">≥ 10 mm dopo ≥ 1 embolia: urgenza</text><text x="436" y="572" fill="#1e293b">≥ 10 mm con disfunzione valvolare severa</text><text x="436" y="588" fill="#1e293b">≥ 10 mm senza emboli, basso rischio (IIb)</text></g><g><rect x="424" y="620" width="312" height="88" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="436" y="644" font-size="13" font-weight="600" fill="#1e293b">Complicanze neurologiche</text><text x="436" y="660" fill="#1e293b">Ischemia, TIA, emboli silenti: non rinviare</text><text x="436" y="676" fill="#1e293b">Emorragia cerebrale: rinvio ≥ 4 settimane</text><text x="436" y="692" fill="#1e293b">Coma: chirurgia non indicata</text></g><g><rect x="424" y="732" width="312" height="88" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="436" y="756" font-size="13" font-weight="600" fill="#1e293b">Dopo l&#x27;intervento</text><text x="436" y="772" fill="#1e293b">Se il paziente rientra: completare la durata</text><text x="436" y="788" fill="#1e293b">pianificata, almeno 14 giorni post-intervento</text><text x="436" y="804" fill="#1e293b">anche con coltura valvolare positiva (AHA)</text></g><g><rect x="24" y="996" width="712" height="104" rx="8" fill="#f1f5f9" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="1020" font-size="13" font-weight="600" fill="#1e293b">Follow-up</text><text x="36" y="1036" fill="#1e293b">Indici di flogosi a 10 e 20 giorni dalla sospensione; rivalutazione infettivologica</text><text x="36" y="1052" fill="#1e293b">ETT 6–12 settimane dopo la chirurgia, presso il centro che ha operato</text><text x="36" y="1068" fill="#1e293b">Educazione del paziente, igiene orale e controlli odontoiatrici</text><text x="36" y="1084" fill="#1e293b">In corso di terapia: ETT o ETE se nuovo soffio, embolia, scompenso, BAV, febbre o emocolture positive</text></g></svg>