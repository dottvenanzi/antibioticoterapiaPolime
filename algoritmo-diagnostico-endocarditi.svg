<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 760 1036" role="img" aria-label="Emocolture, ecocardiografia e criteri Duke-ISCVID guidano la diagnosi" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="dx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1e293b">Emocolture, ecocardiografia e criteri Duke-ISCVID guidano la diagnosi</text><text x="24" y="48" fill="#64748b">Allegato 1 – Algoritmo diagnostico</text><g fill="none" stroke="#94a3b8" stroke-width="1.25"><path d="M272 132H304" marker-end="url(#dx-arrow)"></path><path d="M488 132H456" marker-end="url(#dx-arrow)"></path><path d="M380 156V388" marker-end="url(#dx-arrow)"></path><path d="M192 220H568"></path><path d="M192 220V244" marker-end="url(#dx-arrow)"></path><path d="M568 220V244" marker-end="url(#dx-arrow)"></path><path d="M380 436V500" marker-end="url(#dx-arrow)"></path><path d="M468 412H512" marker-end="url(#dx-arrow)"></path><path d="M132 476V528H264" marker-end="url(#dx-arrow)"></path><path d="M560 436V528H496" marker-end="url(#dx-arrow)"></path><path d="M680 436V500" marker-end="url(#dx-arrow)"></path><path d="M380 556V596" marker-end="url(#dx-arrow)"></path><path d="M136 636V676" marker-end="url(#dx-arrow)"></path><path d="M380 636V676" marker-end="url(#dx-arrow)"></path><path d="M624 636V676" marker-end="url(#dx-arrow)"></path><path d="M380 748V780" marker-end="url(#dx-arrow)"></path><path d="M268 848H176V796" marker-end="url(#dx-arrow)"></path><path d="M492 848H600V796" marker-end="url(#dx-arrow)"></path><path d="M80 796V956" marker-end="url(#dx-arrow)"></path><path d="M380 916V984H248" marker-end="url(#dx-arrow)"></path><path d="M680 796V956" marker-end="url(#dx-arrow)"></path></g><g><rect x="24" y="64" width="248" height="136" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="88" font-size="13" font-weight="600" fill="#1e293b">Segni e sintomi</text><text x="36" y="104" fill="#1e293b">Febbre (fino al 90%)</text><text x="36" y="120" fill="#1e293b">Soffio nuovo o modificato (85%)</text><text x="36" y="136" fill="#1e293b">Embolia all&#x27;esordio (circa 25%)</text><text x="36" y="152" fill="#1e293b">Fenomeni immunologici (2–15%)</text><text x="36" y="168" fill="#1e293b">Batteriemia da S. aureus,</text><text x="36" y="184" fill="#1e293b">E. faecalis o streptococchi</text></g><g><rect x="304" y="108" width="152" height="48" rx="8" fill="#1d4ed8" fill-opacity="0.12" stroke="#1d4ed8" stroke-width="2"></rect><text x="380" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Sospetto clinico</text></g><g><rect x="488" y="64" width="248" height="136" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="500" y="88" font-size="13" font-weight="600" fill="#1e293b">Fattori di rischio</text><text x="500" y="104" fill="#1e293b">Protesi (anche TAVI), CIED</text><text x="500" y="120" fill="#1e293b">Pregressa EI, cardiopatia congenita</text><text x="500" y="136" fill="#1e293b">Valvulopatia più che lieve</text><text x="500" y="152" fill="#1e293b">CMP ipertrofica ostruttiva</text><text x="500" y="168" fill="#1e293b">Droghe e.v., immunodepressione</text><text x="500" y="184" fill="#1e293b">Dialisi, CVC, chirurgia recente</text></g><g><rect x="24" y="244" width="336" height="104" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="268" font-size="13" font-weight="600" fill="#1e293b">Emocolture</text><text x="36" y="284" fill="#1e293b">3 set prima dell&#x27;antibiotico, venipunture separate</text><text x="36" y="300" fill="#1e293b">Non attendere febbre o brivido</text><text x="36" y="316" fill="#1e293b">Ripetere ogni 24–48 h fino a negativizzazione</text><text x="36" y="332" fill="#1e293b">FilmArray sul flacone positivo</text></g><g><rect x="400" y="244" width="336" height="104" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="412" y="268" font-size="13" font-weight="600" fill="#1e293b">Criteri Duke-ISCVID</text><text x="412" y="284" fill="#1e293b">Maggiori: microbiologici, imaging, chirurgico</text><text x="412" y="300" fill="#1e293b">Minori: predisposizione, febbre, fenomeni</text><text x="412" y="316" fill="#1e293b">vascolari e immunologici, microbiologici</text><text x="412" y="332" fill="#64748b">Dettaglio dei criteri: sezione Diagnosi</text></g><g><rect x="24" y="388" width="216" height="88" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="412" font-size="13" font-weight="600" fill="#1e293b">ETE diretto se:</text><text x="36" y="428" fill="#1e293b">Protesi valvolare (anche TAVI)</text><text x="36" y="444" fill="#1e293b">CIED</text><text x="36" y="460" fill="#1e293b">Batteriemia da S. aureus</text></g><g><rect x="292" y="388" width="176" height="48" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="380" y="416" text-anchor="middle" font-size="13" fill="#1e293b">ETT di primo livello</text></g><g><rect x="512" y="388" width="224" height="48" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="624" y="416" text-anchor="middle" font-size="13" fill="#1e293b">Sospetto clinico residuo</text></g><g><rect x="264" y="500" width="232" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="276" y="524" font-size="13" font-weight="600" fill="#1e293b">ETE</text><text x="276" y="540" fill="#1e293b">Definisce lesioni e complicanze</text></g><g><rect x="624" y="500" width="112" height="40" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="680" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">STOP</text></g><text x="388" y="472" fill="#64748b">positivo o non diagnostico</text><text x="490" y="380" text-anchor="middle" fill="#64748b">negativo</text><text x="568" y="472" fill="#64748b">alto</text><text x="688" y="472" fill="#64748b">basso</text><g><rect x="24" y="596" width="712" height="40" rx="8" fill="#f1f5f9" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="380" y="620" text-anchor="middle" font-size="13" fill="#1e293b">Classificazione Duke-ISCVID: emocolture + imaging + criteri clinici</text></g><g><rect x="24" y="676" width="224" height="120" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="36" y="700" font-size="13" font-weight="600" fill="#1e293b">Diagnosi certa</text><text x="36" y="716" fill="#1e293b">Patologica: microrganismi o</text><text x="36" y="732" fill="#1e293b">istologia su valvola, tessuto</text><text x="36" y="748" fill="#1e293b">o embolo</text><text x="36" y="764" fill="#1e293b">Clinica: 2 maggiori; 1 maggiore</text><text x="36" y="780" fill="#1e293b">+ 3 minori; 5 minori</text></g><g><rect x="268" y="676" width="224" height="72" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="280" y="700" font-size="13" font-weight="600" fill="#1e293b">Diagnosi possibile</text><text x="280" y="716" fill="#1e293b">1 maggiore + 1 minore</text><text x="280" y="732" fill="#1e293b">3 minori</text></g><g><rect x="512" y="676" width="224" height="120" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="524" y="700" font-size="13" font-weight="600" fill="#1e293b">Diagnosi esclusa</text><text x="524" y="716" fill="#1e293b">Diagnosi alternativa certa</text><text x="524" y="732" fill="#1e293b">Risoluzione con terapia ≤ 4 gg</text><text x="524" y="748" fill="#1e293b">Nessuna EI a chirurgia o</text><text x="524" y="764" fill="#1e293b">autopsia con terapia ≤ 4 gg</text><text x="524" y="780" fill="#1e293b">Criteri di possibile assenti</text></g><g><rect x="268" y="780" width="224" height="136" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="280" y="804" font-size="13" font-weight="600" fill="#1e293b">Approfondimenti</text><text x="280" y="820" fill="#1e293b">PET/TC con FDG (soprattutto PVE)</text><text x="280" y="836" fill="#1e293b">TC cardiaca</text><text x="280" y="852" fill="#1e293b">RMN encefalo se sintomi o</text><text x="280" y="868" fill="#1e293b">prima della chirurgia</text><text x="280" y="884" fill="#1e293b">TC torace-addome se sintomi</text><text x="280" y="900" fill="#1e293b">ETE ripetuta a 5–7 giorni</text></g><text x="222" y="840" text-anchor="middle" fill="#64748b">se certa</text><text x="546" y="840" text-anchor="middle" fill="#64748b">se esclusa</text><text x="388" y="944" fill="#64748b">se ancora possibile</text><g><rect x="24" y="956" width="224" height="56" rx="8" fill="#15803d" fill-opacity="0.12" stroke="#15803d" stroke-width="2"></rect><text x="136" y="980" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Algoritmo terapeutico</text><text x="136" y="996" text-anchor="middle" fill="#1e293b">Allegato 2</text></g><g><rect x="568" y="956" width="168" height="40" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="652" y="980" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">STOP</text></g></svg>